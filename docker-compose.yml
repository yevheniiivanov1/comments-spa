# The whole system with Docker only: `docker compose up --build`, then open http://localhost:8080.
# Passwords have development defaults; override them in a .env file (see .env.example) anywhere else.
# For development with the .NET SDK, the Aspire AppHost is the faster loop (see README).

name: comments

x-connection-strings: &connection-strings
  ConnectionStrings__commentsdb: Server=sqlserver;Database=comments;User Id=sa;Password=${SQL_PASSWORD:-Comments_Dev_2026!};TrustServerCertificate=true
  ConnectionStrings__redis: redis:6379
  ConnectionStrings__rabbitmq: amqp://${RABBITMQ_USER:-comments}:${RABBITMQ_PASSWORD:-comments_dev}@rabbitmq:5672
  ConnectionStrings__elasticsearch: http://elasticsearch:9200
  ConnectionStrings__blobs: ${BLOB_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:-Comments_Dev_2026!}
      MSSQL_MEMORY_LIMIT_MB: 2048
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - sql-data:/var/opt/mssql
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-comments}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-comments_dev}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

  # Security is off because the node is only reachable on the compose network.
  elasticsearch:
    image: elasticsearch:8.19.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 20s
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data", "--skipApiVersionCheck", "--loose"]
    volumes:
      - blob-data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    image: comments-api
    environment:
      <<: *connection-strings
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Captcha__ExposeAnswerForTesting: ${CAPTCHA_EXPOSE_ANSWER:-false}
      RateLimits__PostsPerMinute: ${POSTS_PER_MINUTE:-10}
      RateLimits__CaptchasPerMinute: ${CAPTCHAS_PER_MINUTE:-30}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      azurite:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    image: comments-worker
    environment:
      <<: *connection-strings
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sql-data:
  rabbitmq-data:
  es-data:
  blob-data:
