name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Angular — test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Comments.Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Comments.Web/package-lock.json

      - run: npm install -g npm@11.19.1
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run build

  dotnet:
    name: .NET — build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet build -c Release

      # Unit tests, then API tests against SQL Server, Redis, RabbitMQ, Elasticsearch and Azurite started by Testcontainers.
      - run: dotnet test -c Release --no-build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [web, dotnet]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker build --target api -t comments-api .
      - run: docker build --target worker -t comments-worker .
